name: Build & Publish

on:
  # 只在打版本 tag 时构建发布；日常推 master 不再触发，PR 仍会验证编译
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  MODULE_REPO: Xposed-Modules-Repo/io.github.ghsssss.ithomeadkill

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version-name: ${{ steps.ver.outputs.name }}
      version-code: ${{ steps.ver.outputs.code }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # 不用 android-actions/setup-android：它内部执行 sdkmanager tools，
      # 而 cmdline-tools 16+ 已移除 legacy tools 包，会直接失败。
      # ubuntu-latest 自带 Android SDK，这里只补装 compileSdk 需要的平台包。
      - name: Configure Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=${SDK}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK}" >> "$GITHUB_ENV"
          SDKMGR="${SDK}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "${SDKMGR}" ]]; then
            SDKMGR="$(ls -d "${SDK}"/cmdline-tools/*/bin 2>/dev/null | sort -V | tail -1)/sdkmanager"
          fi
          echo "sdkmanager: ${SDKMGR}"
          yes | "${SDKMGR}" --licenses > /dev/null 2>&1 || true
          "${SDKMGR}" --install "platforms;android-37.2" \
            || "${SDKMGR}" --install "platforms;android-37" \
            || true
          echo '--- installed platforms ---'
          "${SDKMGR}" --list_installed | sed -n '1,40p'

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF#refs/tags/v}"
          else
            VERSION_NAME="1.1-dev"
          fi
          CORE="${VERSION_NAME%%-*}"
          IFS='.' read -r MAJ MIN PAT <<< "${CORE}"
          VERSION_CODE=$(( ${MAJ:-0}*10000 + ${MIN:-0}*100 + ${PAT:-0} ))
          # 注意：PR 触发的 github.ref 是 refs/pull/2/merge，ref_name 会带斜杠，
          # 不能直接拼文件名，统一用版本号命名
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            APK_NAME="ITHomeAdKill-${GITHUB_REF_NAME}.apk"
          else
            APK_NAME="ITHomeAdKill-${VERSION_NAME}.apk"
          fi
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "apk=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "版本: ${VERSION_NAME} (${VERSION_CODE}) -> ${APK_NAME}"

      - name: Build optimized release APK
        run: >-
          ./gradlew --no-daemon --stacktrace testDebugUnitTest lintRelease assembleRelease
          -PverName=${{ steps.ver.outputs.name }}
          -PverCode=${{ steps.ver.outputs.code }}

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/${{ steps.ver.outputs.apk }}"
          ls -l dist

      - name: Verify versionCode in APK
        run: |
          APK=$(ls dist/*.apk)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1 || true)
          if [[ -n "${BT}" && -x "${BT}/aapt2" ]]; then
            BADGING=$("${BT}/aapt2" dump badging "$APK" | head -1)
            echo "$BADGING"
            echo "$BADGING" | grep -q "versionCode='${{ steps.ver.outputs.code }}'" \
              || { echo "versionCode 注入失败，期望 ${{ steps.ver.outputs.code }}"; exit 1; }
          else
            echo "未找到 aapt2，跳过校验"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ITHomeAdKill
          path: dist/*.apk
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.MODULE_REPO_TOKEN }}
      TAG: ${{ github.ref_name }}
      VERSION_CODE: ${{ needs.build.outputs.version-code }}
      VERSION_NAME: ${{ needs.build.outputs.version-name }}
      # 模块仓库的 tag 约定为 <versionCode>-<versionName>（如 1-1.0、10100-1.1），
      # 用这个格式创建可避免被规范化改名后资产地址失效
      MODULE_TAG: ${{ needs.build.outputs.version-code }}-${{ needs.build.outputs.version-name }}
    steps:
      # 需要完整历史与 tag 才能生成「自上个版本以来的提交」文案
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: ITHomeAdKill
          path: dist

      - name: Generate release notes
        run: |
          set -euo pipefail
          # 必须排除当前 tag：重发同一版本时它会指向新提交，
          # 用 HEAD^ 会匹配到自身，导致文案范围为空
          PREV="$(git describe --tags --abbrev=0 --exclude="${TAG}" HEAD 2>/dev/null || true)"
          if [[ -n "${PREV}" ]]; then
            RANGE="${PREV}..HEAD"
            echo "提交范围: ${RANGE}"
          else
            RANGE="HEAD"
            echo "未找到上一个 tag，使用全量提交"
          fi
          {
            echo "## 更新内容"
            echo
            # 过滤掉 CI 自身的提交，只保留功能/文档类改动
            git log --no-merges --pretty=format:'- %s' "${RANGE}" | grep -v -- '^- ci: ' || true
            echo
            if [[ -n "${PREV}" ]]; then
              echo
              echo "完整变更: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
            fi
          } > notes.md
          echo '--- notes.md ---'
          cat notes.md

      - name: Publish to own repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "$TAG" dist/*.apk --repo "${GITHUB_REPOSITORY}" \
              --title "$TAG" --notes-file notes.md --latest
          fi
          # 兜底：gh 在本环境可能创建为草稿，草稿的资产对匿名用户 404，
          # 且不会被标为 Latest，这里强制发布并用提交文案覆盖说明
          gh release edit "$TAG" --repo "${GITHUB_REPOSITORY}" --draft=false --latest \
            --notes-file notes.md

      - name: Publish to LSPosed module repo
        run: |
          if gh release view "$MODULE_TAG" --repo "${MODULE_REPO}" > /dev/null 2>&1; then
            gh release upload "$MODULE_TAG" dist/*.apk --repo "${MODULE_REPO}" --clobber
          else
            gh release create "$MODULE_TAG" dist/*.apk --repo "${MODULE_REPO}" \
              --title "$TAG" --notes-file notes.md
          fi
          # 草稿不会被 LSPosed 抓取，也不会被客户端看到，强制发布
          gh release edit "$MODULE_TAG" --repo "${MODULE_REPO}" --draft=false --notes-file notes.md

      - name: Sync README and updates.json
        env:
          CHANGELOG_FILE: ${{ github.workspace }}/notes.md
        run: |
          set -euo pipefail
          gh auth setup-git
          rm -rf modrepo
          git clone --depth 1 "https://github.com/${MODULE_REPO}.git" modrepo
          cd modrepo
          # 模块仓库的 README 不会自动更新，这里与源码仓库保持一致
          cp "${GITHUB_WORKSPACE}/README.md" README.md
          export TAG VERSION_CODE CHANGELOG_FILE
          # 下载地址必须用模块仓库的真实 tag（<versionCode>-<versionName>）
          export ZIP_URL="https://github.com/${MODULE_REPO}/releases/download/${MODULE_TAG}/ITHomeAdKill-${TAG}.apk"
          python3 - <<'PY'
          import json, os, pathlib

          p = pathlib.Path("updates.json")
          data = json.loads(p.read_text(encoding="utf-8")) if p.exists() else {"updates": []}
          code = int(os.environ["VERSION_CODE"])
          # changelog 用与 Release 相同的提交文案
          notes = ""
          cf = os.environ.get("CHANGELOG_FILE")
          if cf and pathlib.Path(cf).exists():
              lines = [l.strip() for l in pathlib.Path(cf).read_text(encoding="utf-8").splitlines()]
              notes = "\n".join(
                  l for l in lines
                  if l and not l.startswith("## ") and not l.startswith("完整变更")
              )
          item = {
              "version": os.environ["TAG"],
              "versionCode": code,
              "zipUrl": os.environ["ZIP_URL"],
              "changelog": notes or f"CI 构建 {os.environ.get('GITHUB_SHA', '')}",
          }
          items = [u for u in data.get("updates", []) if u.get("versionCode") != code]
          items.append(item)
          data["updates"] = sorted(items, key=lambda u: u.get("versionCode", 0))
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY
          git add updates.json README.md
          if git diff --cached --quiet; then
            echo "README/updates.json 无变化，跳过提交"
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "release ${TAG}"
            git push
          fi
